AllCops:
  SuggestExtensions: true
  NewCops: enable

Lint/RaiseException:
  Enabled: true

Lint/StructNewOverride:
  Enabled: true

Style/HashEachMethods:
  Enabled: true

Style/HashTransformKeys:
  Enabled: true

Style/HashTransformValues:
  Enabled: true

RSpec/MultipleExpectations:
  Enabled: false

RSpec/LeakyConstantDeclaration:
  Enabled: false

# This standalone Ruby 2.0 runner reports reproduction results, not RSpec examples.
RSpec/Output:
  Exclude:
    - spec/integration/historical_sharding/reproduce.rb

inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rspec
  - rubocop-rake

name: Test

on: [push, pull_request]

jobs:
  sharding:
    name: Sharded collections (MongoDB ${{ matrix.mongo }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mongo: ['6.0', '8.0']
    env:
      SHARDED_MONGODB_URI: mongodb://localhost:27028/mongoid_locker_sharding_test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Start sharded MongoDB
        run: |
          docker run -d --name locker-sharding -p 27028:27017 \
            -v "$PWD/spec/integration/sharding/start.sh:/start.sh:ro" \
            mongo:${{ matrix.mongo }} bash /start.sh
          for attempt in $(seq 1 60); do
            if docker exec locker-sharding mongosh --quiet --eval 'if (db.adminCommand({listShards:1}).shards.length !== 1) throw new Error("Shard not ready")' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs locker-sharding
          exit 1
      - name: Run sharding integration tests
        run: bundle exec rspec spec/integration/sharding
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '2.6', mongo: '4.4', mongoid: '5' }
          - { ruby: 'jruby-9.4', mongo: '4.4', mongoid: '5' }
          - { ruby: '2.7', mongo: '4.4', mongoid: '6' }
          - { ruby: '3.1', mongo: '4.4', mongoid: '6' }
          - { ruby: 'jruby-9.4', mongo: '4.4', mongoid: '6' }
          - { ruby: '3.0', mongo: '4.4', mongoid: '7' }
          - { ruby: '3.4', mongo: '4.4', mongoid: '7' }
          - { ruby: '2.6', mongo: '6.0', mongoid: '8' }
          - { ruby: '3.1', mongo: '7.0', mongoid: '8' }
          - { ruby: '3.3', mongo: '7.0', mongoid: '9' }
          - { ruby: '3.4', mongo: '8.0', mongoid: '9' }
          - { ruby: '4.0', mongo: '7.0', mongoid: '8' }
          - { ruby: '4.0', mongo: '8.0', mongoid: '9', coverage: 'true' }
    name: test (ruby=${{ matrix.ruby }}, mongo=${{ matrix.mongo }}, mongoid=${{ matrix.mongoid }})
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})' || mongo --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGOID_VERSION: ${{ matrix.mongoid }}
      COVERAGE: ${{ matrix.coverage }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rspec
      - name: Report coverage
        if: ${{ matrix.coverage == 'true' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/.resultset.json
          format: simplecov
